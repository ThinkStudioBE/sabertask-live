# Render Blueprint for Sabertask Sales (the live build).
#
# Free plan, and the database is not on it. This app collects real companies
# somebody went looking for, and a free instance has an ephemeral filesystem,
# so a SQLite file here would quietly lose the pipeline on every cold start.
# DATABASE_URL points at a managed Postgres and that is where everything lives,
# the editable country set included.
#
# Consequence of the free plan: the service sleeps after about fifteen minutes
# of silence and the first request after that takes 30 to 60 seconds. The data
# survives it.
services:
  - type: web
    name: sabertask-live
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Served from Think Studio's own domain. Render issues the certificate
    # once the CNAME points here; the .onrender.com address keeps working.
    domains:
      - sabertask-live.think-studio.com
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Signs the session cookie. Render generates it, so it never sits in git.
      - key: SESSION_SECRET
        generateValue: true
      # Served over HTTPS, so the cookie never goes out in clear.
      - key: SESSION_SECURE
        value: "true"
      # The shared password for every account. Set it in the Render
      # dashboard; the login page's hint reads it, so the two cannot drift.
      - key: SABERTASK_PASSWORD
        sync: false
      # Cold mail is drafted by Claude. Paste the key in the Render dashboard;
      # without it the app still runs and falls back to a plain drafter, and the
      # reason is printed once per draft in the service log.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Postgres. Everything the app learns lives here rather than on the
      # container, which is thrown away on every restart. Paste the Neon
      # connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
